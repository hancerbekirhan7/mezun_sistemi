<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mezun Bilgi Sistemi</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <nav>
        <ul>
            <li><a href="mezun_bilgi.html">Anasayfa</a></li>
            <li><a href="about.html">Hakkında</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
            <li><a href="mezunlar_listesi.html">Mezunlar Listesi</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Eskişehir Teknik Üniversitesi Mezun Bilgi Sistemi</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Ad Soyad:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">E-posta:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Telefon:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="year">Mezuniyet Yılı:</label>
                <input type="number" id="year" name="year" required>
            </div>
            <button type="submit">Ekle</button>
        </form>
    </div>
    <script src="script.js"></script> <!-- JavaScript dosyasını dahil etme -->
</body>

</html>
